# cargo-deny policy: self-enforces the pure MIT dependency rule
# (dogfooding Feature 2 of spec.txt). Run locally with: cargo deny check

[licenses]
version = 2
# Pure MIT. A dual "MIT OR Apache-2.0" crate passes through its MIT option.
# Anything that needs Apache-2.0, Unicode-3.0, or Zlib alone is rejected.
allow = [
    "MIT",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
