[package]
name = "tpt-cargo-vitals"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["TPT Solutions"]
license = "MIT OR Apache-2.0"
description = "Local-first supply-chain & dependency auditor for Rust projects: CVEs, license policy, and bloat."
repository = "https://github.com/tpt-solutions/tpt-cargo-vitals"
homepage = "https://github.com/tpt-solutions/tpt-cargo-vitals"
readme = "README.md"
keywords = ["cargo", "audit", "security", "license", "dependencies"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = "4"
comfy-table = "8.0.0"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
json = "0.12.4"
owo-colors = "4.4.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
semver = "1.0.28"
tar = "0.4.46"
toml = "1.1.8"
