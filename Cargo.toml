[package]
name = "tpt-cargo-vitals"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["TPT Solutions"]
license = "MIT OR Apache-2.0"
description = "Local-first supply-chain & dependency auditor for Rust projects: CVEs, license policy, and bloat."
repository = "https://github.com/tpt-solutions/tpt-cargo-vitals"
homepage = "https://github.com/tpt-solutions/tpt-cargo-vitals"
readme = "README.md"
keywords = ["cargo", "audit", "security", "license", "dependencies"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
cargo_metadata = "0.20.0"
clap = { version = "4", features = ["derive"] }
flate2 = "1.1.10"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
rustsec = { version = "0.32.0", default-features = false }
tar = "0.4.46"
ureq = { version = "3.5.0", default-features = false, features = ["native-tls-no-default"] }
